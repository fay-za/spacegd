<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceGD | Demonlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #08070d;
      --bg-surface: #100d1a;
      --bg-card: #181427;
      --bg-card-hover: #221c38; 
      --border-color: #2b2342;
      --border-glow: rgba(255, 115, 0, 0.3);
      
      --accent-orange: #ff7700;
      --accent-orange-glow: rgba(255, 119, 0, 0.25);
      --accent-red: #ff2a55;
      --accent-purple: #9d4edd;
      
      --text-main: #f8f8fc;
      --text-muted: #9b94b3;
      --text-dim: #635b7b;
      
      --font-main: 'Outfit', -apple-system, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 0, 0.08) 0%, transparent 40%);
    }

    header {
      background: rgba(16, 13, 26, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 2.5rem 1.5rem 1.75rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: clamp(.75rem, 1.875vw, 1.1625rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.25rem;
      filter: drop-shadow(0 0 25px var(--accent-orange-glow));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .nav-tabs {
      display: inline-flex;
      background: rgba(8, 7, 13, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      padding: 5px;
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 26px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: var(--font-main);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-orange) 0%, #ff5500 100%);
      color: #000;
      box-shadow: 0 4px 20px var(--accent-orange-glow);
    }

    main {
      max-width: 960px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.25rem;
      flex-grow: 1;
    }

    .controls-wrapper {
      margin-bottom: 2rem;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 20px 16px 52px;
      color: var(--text-main);
      font-size: 1rem;
      font-family: var(--font-main);
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .search-input:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 4px var(--accent-orange-glow);
      background: var(--bg-card-hover);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: "";
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-color) 0%, transparent 100%);
    }

    .view-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: transparent;
      transition: background 0.2s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 119, 0, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .card:hover::before {
      background: var(--accent-orange);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-grow: 1;
      min-width: 0;
    }

    .rank-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .rank-1 { background: linear-gradient(135deg, #ffe259, #ffa751); color: #000; border: none; box-shadow: 0 0 12px rgba(255,167,81,0.4); }
    .rank-2 { background: linear-gradient(135deg, #e0e0e0, #f5f5f5); color: #000; border: none; box-shadow: 0 0 12px rgba(255,255,255,0.3); }
    .rank-3 { background: linear-gradient(135deg, #e5a65d, #ab6f2a); color: #000; border: none; box-shadow: 0 0 12px rgba(229,166,93,0.3); }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .card-subtitle strong {
      color: var(--accent-orange);
      font-weight: 600;
    }

    .tag-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .tag {
      background: rgba(255, 119, 0, 0.1);
      color: var(--accent-orange);
      border: 1px solid rgba(255, 119, 0, 0.2);
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .tag:hover {
      background: rgba(255, 119, 0, 0.25);
      border-color: var(--accent-orange);
      transform: scale(1.04);
      box-shadow: 0 2px 8px rgba(255,119,0,0.15);
    }

    .tag.difficulty-tag {
      background: rgba(255, 42, 85, 0.15);
      color: var(--accent-red);
      border-color: rgba(255, 42, 85, 0.3);
    }

    .tag.difficulty-tag:hover {
      background: rgba(255, 42, 85, 0.25);
      border-color: var(--accent-red);
      box-shadow: 0 2px 8px rgba(255,42,85,0.2);
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .demon-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 42, 85, 0.4));
      user-select: none;
    }

    .info-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .info-btn:hover {
      background: var(--accent-orange);
      color: #000;
      border-color: var(--accent-orange);
      transform: scale(1.05);
    }

    .points-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-top: 2rem;
    }

    .points-panel h3 {
      color: var(--accent-orange);
      margin-bottom: 14px;
      font-size: 1.1rem;
      font-family: var(--font-display);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .points-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    .point-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .point-card span {
      color: var(--text-main);
      font-weight: 700;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 9, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
      padding: 1.25rem;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--accent-orange);
      font-weight: 700;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .modal-body {
      color: var(--text-main);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
    }

    .modal-row:last-child {
      border: none;
      margin-bottom: 0;
    }

    .modal-label {
      color: var(--text-muted);
    }

    .modal-val {
      font-weight: 600;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.88rem;
      background: var(--bg-surface);
      margin-top: auto;
    }

    footer strong {
      color: var(--accent-orange);
    }
  </style>
</head>

  <script>
    const EASY_DEMON_ICON_PNG = "https://github.com/fay-za/spacegd/blob/main/easy.png?raw=true";
    const MEDIUM_DEMON_ICON_PNG = "https://github.com/fay-za/spacegd/blob/main/medium.png?raw=true";
    const HARD_DEMON_ICON_PNG = "https://github.com/fay-za/spacegd/blob/main/hard.png?raw=true";
    const INSANE_DEMON_ICON_PNG = "https://github.com/fay-za/spacegd/blob/main/insane.png?raw=true";
    const EXTREME_DEMON_ICON_PNG = "https://github.com/fay-za/spacegd/blob/main/extreme.png?raw=true";

    const DEMON_ICONS = {
      easy: EASY_DEMON_ICON_PNG,
      medium: MEDIUM_DEMON_ICON_PNG,
      hard: HARD_DEMON_ICON_PNG,
      insane: INSANE_DEMON_ICON_PNG,
      extreme: EXTREME_DEMON_ICON_PNG
    };

    function getDemonIcon(diff) {
      return DEMON_ICONS[diff?.toLowerCase()] || HARD_DEMON_ICON_PNG;
    }

    const POINT_SCALE = {

      2: 80,
      3: 75,
      4: 50,
      5: 35,
      6: 25,
      7: 20,
      8: 10,
      9: 5,
      10: 1
    };

    function getPointsByRank(rank) {
      return POINT_SCALE[rank] || 0;
    }

};

    function assignLevelRanks() {
      levelsData.classic.forEach((lvl, index) => {
        lvl.rank = index + 1;
      });
      levelsData.platformer.forEach((lvl, index) => {
        lvl.rank = index + 1;
      });
    }

    let computedPlayersData = [];
    let currentView = 'levels';

    function calculatePlayerScores() {
      const playerMap = {};

      const touchPlayer = (name) => {
        if (!playerMap[name]) {
          playerMap[name] = { name, classicPts: 0, platformerPts: 0 };
        }
      };

      levelsData.classic.forEach(lvl => {
        const points = getPointsByRank(lvl.rank);
        const completers = new Set([lvl.verifier, ...lvl.victors].filter(Boolean));
        
        completers.forEach(player => {
          touchPlayer(player);
          playerMap[player].classicPts += points;
        });
      });

      levelsData.platformer.forEach(lvl => {
        const points = getPointsByRank(lvl.rank);
        const completers = new Set([lvl.verifier, ...lvl.victors].filter(Boolean));
        
        completers.forEach(player => {
          touchPlayer(player);
          playerMap[player].platformerPts += points;
        });
      });

      computedPlayersData = Object.values(playerMap)
        .map(p => ({
          ...p,
          totalPts: p.classicPts + p.platformerPts
        }))
        .sort((a, b) => b.totalPts - a.totalPts)
        .map((p, index) => ({
          ...p,
          rank: index + 1
        }));
    }

    function init() {
      assignLevelRanks();
      calculatePlayerScores();
      renderLevels();
      renderPlayers();
    }

    function renderLevels(filter = '') {
      const classicContainer = document.getElementById('classicList');
      const platformerContainer = document.getElementById('platformerList');
      const filterTerm = filter.toLowerCase().trim();

      const filterFn = (lvl) => {
        const text = `${lvl.title} ${lvl.creator} ${lvl.diff || ''} demon ${lvl.tags.join(' ')} ${lvl.verifier} ${lvl.victors.join(' ')}`.toLowerCase();
        return text.includes(filterTerm);
      };

      const classicFiltered = levelsData.classic.filter(filterFn);
      const platformerFiltered = levelsData.platformer.filter(filterFn);

      classicContainer.innerHTML = classicFiltered.length 
        ? classicFiltered.map(lvl => createLevelCard(lvl)).join('') 
        : `<div class="empty-state">No classic levels matching search</div>`;

      platformerContainer.innerHTML = platformerFiltered.length 
        ? platformerFiltered.map(lvl => createLevelCard(lvl)).join('') 
        : `<div class="empty-state">No platformer levels matching search</div>`;
    }

	function createLevelCard(lvl) {
	  const rankClass = lvl.rank <= 3 ? `rank-${lvl.rank}` : '';
	  const iconUrl = getDemonIcon(lvl.diff);
	  const diffLabel = lvl.diff ? `${lvl.diff.toUpperCase()}` : 'DEMON';

	  return `
		<li class="card" onclick="openLevelModal('${lvl.id}')">
		  <div class="card-left">
			<div class="rank-badge ${rankClass}">#${lvl.rank}</div>
			<div class="card-content">
			  <span class="card-title">${lvl.title}</span>
			  <span class="card-subtitle">by <strong>${lvl.creator}</strong></span>
			  <div class="tag-container" onclick="event.stopPropagation(); event.preventDefault();">
				<span class="tag difficulty-tag" data-tag="${diffLabel}" onclick="filterByTag('${diffLabel}'); event.stopPropagation();">${diffLabel}</span>
				${lvl.tags.map(t => `<span class="tag" data-tag="${t}" onclick="filterByTag('${t}'); event.stopPropagation();">${t}</span>`).join('')}
			  </div>
			</div>
		  </div>
		  <div class="card-right">
			<img class="demon-icon" src="${iconUrl}" alt="${lvl.diff} Demon" title="${lvl.diff} Demon" />
		  </div>
		</li>
	  `;
	}

    function renderPlayers(filter = '') {
      const container = document.getElementById('playerList');
      const filterTerm = filter.toLowerCase().trim();

      const filtered = computedPlayersData.filter(p => p.name.toLowerCase().includes(filterTerm));

      container.innerHTML = filtered.length 
        ? filtered.map(p => {
            const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
            return `
              <li class="card" onclick="openPlayerModal('${p.name}')">
                <div class="card-left">
                  <div class="rank-badge ${rankClass}">#${p.rank}</div>
                  <div class="card-content">
                    <span class="card-title">${p.name}</span>
                    <span class="card-subtitle">Score: <strong>${p.totalPts} pts</strong></span>
                  </div>
                </div>
              </li>
            `;
          }).join('')
        : `<div class="empty-state">No players found</div>`;
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value;
      if (currentView === 'levels') {
        renderLevels(query);
      } else {
        renderPlayers(query);
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      const levelsView = document.getElementById('levelsView');
      const playersView = document.getElementById('playersView');
      const btnLevels = document.getElementById('btn-levels');
      const btnPlayers = document.getElementById('btn-players');

      if (viewName === 'levels') {
        levelsView.classList.add('active');
        playersView.classList.remove('active');
        btnLevels.classList.add('active');
        btnPlayers.classList.remove('active');
      } else {
        playersView.classList.add('active');
        levelsView.classList.remove('active');
        btnPlayers.classList.add('active');
        btnLevels.classList.remove('active');
      }
      handleSearch();
    }

    function setupTagListeners() {
      document.body.addEventListener('click', (e) => {
        const tagElement = e.target.closest('.tag');
        if (!tagElement) return;
        
        const tagText = tagElement.getAttribute('data-tag');
        if (!tagText) return;

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.value = tagText;
          handleSearch();
          
          if (currentView !== 'levels') {
            switchView('levels');
          }
        }
      });
    }

    function openLevelModal(lvlId) {
      let lvl = levelsData.classic.find(x => x.id === lvlId) || levelsData.platformer.find(x => x.id === lvlId);
      if (!lvl) return;

      const pts = getPointsByRank(lvl.rank);
      const diffText = lvl.diff ? `${lvl.diff.charAt(0).toUpperCase() + lvl.diff.slice(1)} Demon` : 'Demon';

      document.getElementById('modalTitle').innerText = lvl.title;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-row"><span class="modal-label">Rank</span><span class="modal-val">#${lvl.rank} (${pts} pts)</span></div>
        <div class="modal-row"><span class="modal-label">Difficulty</span><span class="modal-val">${diffText}</span></div>
        <div class="modal-row"><span class="modal-label">Creator</span><span class="modal-val">${lvl.creator}</span></div>
        <div class="modal-row"><span class="modal-label">Verifier</span><span class="modal-val">${lvl.verifier}</span></div>
        <div class="modal-row"><span class="modal-label">Victors</span><span class="modal-val">${lvl.victors.length ? lvl.victors.join(', ') : 'None'}</span></div>
        <div class="modal-row"><span class="modal-label">Tags</span><span class="modal-val">${lvl.tags.join(', ')}</span></div>
		<div class="modal-row"><span class="modal-label">ID</span><span class="modal-val">${lvl.lvlid}</span></div>
      `;
      document.getElementById('infoModal').classList.add('open');
    }

    function openPlayerModal(playerName) {
      const player = computedPlayersData.find(p => p.name === playerName);
      if (!player) return;

      document.getElementById('modalTitle').innerText = player.name;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-row"><span class="modal-label">Leaderboard Rank</span><span class="modal-val">#${player.rank}</span></div>
        <div class="modal-row"><span class="modal-label">Classic Points</span><span class="modal-val">${player.classicPts} pts</span></div>
        <div class="modal-row"><span class="modal-label">Platformer Points</span><span class="modal-val">${player.platformerPts} pts</span></div>
        <div class="modal-row"><span class="modal-label">Total Points</span><span class="modal-val">${player.totalPts} pts</span></div>
      `;
      document.getElementById('infoModal').classList.add('open');
    }

    function closeModal(event) {
      if (event.target.id === 'infoModal') {
        document.getElementById('infoModal').classList.remove('open');
      }
    }

    function forceCloseModal() {
      document.getElementById('infoModal').classList.remove('open');
    }

	document.addEventListener('click', function(e) {
	  const tag = e.target.closest('.tag');
	  if (!tag) return;
	  
	  e.stopPropagation();
	  e.stopImmediatePropagation();
	  e.preventDefault();
	  
	  const tagText = tag.getAttribute('data-tag');
	  const searchInput = document.getElementById('searchInput');
	  
	  searchInput.value = tagText;
	  
	  if (currentView !== 'levels') {
		switchView('levels');
	  }
	  
	  renderLevels(tagText);
	  
	  return false;
	});
	
	function filterByTag(tagText) {
	  const searchInput = document.getElementById('searchInput');
	  searchInput.value = tagText;
	  
	  if (currentView !== 'levels') {
		switchView('levels');
	  }
	  
	  renderLevels(tagText);
	}

	init();

	init();
    setupTagListeners();
  </script>
</body>
</html>
